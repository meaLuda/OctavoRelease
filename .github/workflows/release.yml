# Build the plugin from this repository's source, sign the build (GitHub artifact attestations) and publish
# the release. Triggered by pushing a tag equal to manifest.json's version, e.g. 1.0.2.
name: Release
on:
  push:
    tags: ['*.*.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the tag matches the plugin manifest
        run: test "$(node -p "require('./packages/plugin/manifest.json').version")" = "${GITHUB_REF_NAME}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/plugin/dist/main.js
            packages/plugin/dist/styles.css
            packages/plugin/dist/manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a hyphen (1.0.4-beta.1) are pre-releases: BRAT testers only, never directory users.
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" packages/plugin/dist/main.js packages/plugin/dist/manifest.json packages/plugin/dist/styles.css \
            --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $PRE
